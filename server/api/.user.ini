; -----------------------------------------------------------------------
; PHP runtime overrides for /api/ on IONOS shared hosting (PHP-FPM).
; -----------------------------------------------------------------------
; IONOS defaults can cap upload_max_filesize / post_max_size below the
; 15 MB ceiling enforced by uploads.php (MAX_UPLOAD_BYTES). Without these
; overrides any image >~500 KB to a few MB silently fails with HTTP 500
; / empty $_FILES because PHP rejects the multipart body before our code
; runs. We raise the headroom to 20 MB so the 15 MB cap in PHP code is
; the real limit. memory_limit and execution time are bumped slightly to
; cope with finfo + move_uploaded_file on larger files.
;
; .user.ini is honored by PHP-FPM (IONOS) per directory; cached for 5
; minutes by default. If a change here doesn't take effect, wait or
; touch the directory's mtime.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 128M
max_execution_time = 60
max_input_time = 60
file_uploads = On