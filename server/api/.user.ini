; -----------------------------------------------------------------------
; PHP runtime overrides for the /api/ directory on IONOS shared hosting.
;
; IONOS's default `upload_max_filesize` / `post_max_size` is ~2 MB, which
; silently truncates larger uploads (the browser sees an HTML 500 with no
; useful body). The Admin > Archivos uploader allows up to 15 MB per file
; (see MAX_UPLOAD_BYTES in src/hooks/useUploads.ts and server/api/uploads.php),
; so we raise the PHP limits here to match. `post_max_size` must be larger
; than `upload_max_filesize` to leave room for form fields + multi-file
; batches.
;
; `.user.ini` is read per-directory by PHP-FPM on most shared hosts (IONOS
; included). Apply by deploying this file to /api/.user.ini alongside the
; other PHP endpoints. Cached for 5 min by default — wait or touch the
; file to force a refresh.
; -----------------------------------------------------------------------
upload_max_filesize = 16M
post_max_size       = 32M
memory_limit        = 64M
max_execution_time  = 60